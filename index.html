<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusFlow · 智流平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05080f;--panel:#0b111d;--panel2:#111a2b;--panel3:#16213a;
  --border:#1a2437;--border2:#28374f;
  --txt:#e6edfa;--txt2:#8fa3c0;--txt3:#556a89;
  --cyan:#22d3ee;--violet:#8b5cf6;--green:#10e08a;
  --amber:#fbbf24;--red:#f43f5e;--pink:#ec4899;--teal:#14b8a6;--blue:#3b82f6;
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 480px at 8% -8%,rgba(37,99,235,.1),transparent 62%),
    radial-gradient(800px 480px at 96% 4%,rgba(96,165,250,.06),transparent 62%);}
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ===== 顶栏 ===== */
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(11,17,29,.98),rgba(8,12,21,.92));
  backdrop-filter:blur(16px);z-index:50;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:5px 10px 5px 5px;border-radius:10px;transition:.2s;}
.brand:hover{background:rgba(22,33,58,.6);}
.brand-logo{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#1e3a8a,#2563eb);
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.brand-name{font-size:13px;font-weight:800;
  background:linear-gradient(90deg,#e6edfa,#3b82f6,#60a5fa,#e6edfa);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:textFlow 6s linear infinite;}
@keyframes textFlow{to{background-position:300% 50%}}
.brand-sub{font-size:9px;color:var(--txt3);letter-spacing:.5px;margin-top:1px;}
.top-menu{display:flex;gap:3px;flex:1;overflow-x:auto;padding:0 10px;height:40px;align-items:center;}
.top-menu::-webkit-scrollbar{height:0}
.menu-item{display:flex;align-items:center;gap:6px;padding:7px 12px;
  border-radius:8px;font-size:11.5px;font-weight:600;
  color:var(--txt3);cursor:pointer;transition:.2s;white-space:nowrap;}
.menu-item:hover{background:rgba(22,33,58,.6);color:var(--txt2);}
.menu-item.active{background:linear-gradient(135deg,rgba(37,99,235,.25),rgba(96,165,250,.1));
  color:#fff;box-shadow:0 0 14px rgba(37,99,235,.25);}
.top-stats{display:flex;gap:14px;flex-shrink:0;padding-left:14px;
  border-left:1px solid var(--border);height:32px;align-items:center;}
.ts-item{display:flex;flex-direction:column;}
.ts-label{font-size:8px;color:var(--txt3);}
.ts-val{font-size:11.5px;font-weight:700;}
.ts-val.c{color:var(--cyan)}.ts-val.v{color:var(--violet)}
.ts-val.g{color:var(--green)}.ts-val.a{color:var(--amber)}

/* ===== 8步流程引导 ===== */
.guide-bar{flex-shrink:0;padding:12px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(8,12,21,.9),rgba(5,8,15,.7));
  display:flex;align-items:center;gap:8px;overflow-x:auto;}
.guide-bar::-webkit-scrollbar{height:0}
.guide-step{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-radius:8px;border:1px solid var(--border);background:rgba(17,26,43,.5);
  cursor:pointer;transition:.2s;min-width:130px;position:relative;}
.guide-step:hover{border-color:var(--border2);background:rgba(22,33,58,.7);}
.guide-step.done{border-color:rgba(16,224,138,.4);background:rgba(16,224,138,.06);}
.guide-step.active{border-color:rgba(59,130,246,.6);background:rgba(37,99,235,.15);
  box-shadow:0 0 12px rgba(37,99,235,.3);}
.guide-num{width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
  background:rgba(143,163,192,.14);color:var(--txt3);}
.guide-step.done .guide-num{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.guide-step.active .guide-num{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;}
.guide-text{font-size:10.5px;font-weight:600;color:var(--txt2);}
.guide-step.done .guide-text{color:#4ef0ac;}
.guide-step.active .guide-text{color:#fff;}
.guide-arrow{flex-shrink:0;color:var(--txt3);font-size:12px;}

/* ===== 主容器 ===== */
.main{flex:1;position:relative;min-height:0;overflow:hidden;}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:scale(1.02);pointer-events:none;transition:.4s;}
.view.active{opacity:1;transform:scale(1);pointer-events:auto;}

.page-head{height:54px;flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:0 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(11,17,29,.6),rgba(8,12,21,.3));}
.page-icon{width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  background:linear-gradient(135deg,rgba(37,99,235,.25),rgba(96,165,250,.1));
  border:1px solid rgba(59,130,246,.4);color:#60a5fa;}
.page-title{font-size:13.5px;font-weight:750;}
.page-desc{font-size:10.5px;color:var(--txt3);margin-top:2px;}
.page-head .right{margin-left:auto;display:flex;gap:8px;}

.content{flex:1;overflow-y:auto;padding:16px;min-height:0;}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
  border-radius:8px;border:1px solid var(--border2);background:var(--panel2);
  color:var(--txt2);font-size:11.5px;cursor:pointer;transition:.2s;
  font-family:inherit;font-weight:500;white-space:nowrap;}
.btn:hover{background:var(--panel3);color:var(--txt);border-color:#3a4d6d;}
.btn-primary{background:linear-gradient(135deg,#1e3a8a,#2563eb);border:none;color:#fff;
  font-weight:600;box-shadow:0 4px 16px rgba(37,99,235,.4);}
.btn-primary:hover{filter:brightness(1.15);}
.btn-danger{border-color:rgba(244,63,94,.4);color:#ff8ba0;background:rgba(244,63,94,.07);}
.btn-danger:hover{background:rgba(244,63,94,.18);}
.btn-warn{border-color:rgba(251,191,36,.4);color:#fcd34d;background:rgba(251,191,36,.07);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;font-weight:600;}
.btn-sm{padding:4px 9px;font-size:10.5px;border-radius:6px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}

.status-pill{font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:20px;
  display:inline-flex;align-items:center;gap:3px;}
.status-pill.done,.status-pill.ready,.status-pill.online{background:rgba(16,224,138,.14);color:#4ef0ac}
.status-pill.draft,.status-pill.offline{background:rgba(143,163,192,.14);color:#8fa3c0}
.status-pill.running,.status-pill.busy{background:rgba(251,191,36,.14);color:#fcd34d}
.status-pill.error{background:rgba(244,63,94,.14);color:#ff8ba0}

/* 网格卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.card{padding:14px;border-radius:11px;
  background:linear-gradient(180deg,rgba(18,26,43,.8),rgba(13,19,32,.9));
  border:1px solid var(--border);cursor:pointer;transition:.25s;position:relative;}
.card:hover{border-color:rgba(59,130,246,.5);transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,.5);}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.card-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;}
.card-name{font-size:12px;font-weight:700;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-desc{font-size:10px;color:var(--txt3);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);
  display:flex;justify-content:space-between;font-size:9.5px;color:var(--txt3);}
.card-badge{position:absolute;top:10px;right:10px;font-size:8.5px;font-weight:700;
  padding:2px 6px;border-radius:4px;}
.card-actions{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);
  display:flex;gap:6px;}

/* 表单 */
.field{margin-bottom:12px;}
.field label{display:block;font-size:9.5px;color:var(--txt3);margin-bottom:5px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.field input,.field textarea,.field select{
  width:100%;padding:8px 11px;border-radius:7px;
  background:rgba(5,8,15,.85);border:1px solid var(--border2);
  color:var(--txt);font-size:11.5px;font-family:inherit;outline:none;transition:.2s;}
.field textarea{resize:vertical;min-height:70px;
  font-family:ui-monospace,monospace;font-size:11px;}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-hint{font-size:9.5px;color:var(--txt3);margin-top:4px;line-height:1.5;}

/* 多选标签 */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:7px;
  background:rgba(5,8,15,.6);border:1px solid var(--border2);min-height:44px;}
.tag-option{padding:4px 10px;border-radius:14px;font-size:10.5px;
  background:rgba(143,163,192,.12);color:var(--txt2);
  border:1px solid var(--border2);cursor:pointer;transition:.2s;}
.tag-option:hover{border-color:#3b82f6;color:#60a5fa;}
.tag-option.on{background:rgba(37,99,235,.2);color:#fff;border-color:#3b82f6;}

/* 模态框 */
.modal-mask{position:fixed;inset:0;z-index:9998;display:none;
  align-items:center;justify-content:center;background:rgba(2,5,12,.8);backdrop-filter:blur(8px);}
.modal-mask.show{display:flex;}
.modal-box{width:620px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(15,23,42,.99),rgba(8,12,21,1));
  border:1px solid rgba(59,130,246,.45);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.85);}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;background:rgba(8,12,21,.6);}
.modal-title{font-size:13px;font-weight:750;flex:1;}
.modal-close{width:24px;height:24px;border-radius:6px;border:1px solid var(--border2);
  background:transparent;color:var(--txt3);cursor:pointer;font-size:12px;}
.modal-close:hover{color:var(--txt);border-color:#3b82f6;}
.modal-body{flex:1;overflow-y:auto;padding:18px;min-height:0;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;}

/* Toast */
.toast-wrap{position:fixed;top:70px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:10px 14px;border-radius:10px;font-size:12px;
  background:rgba(22,33,58,.98);border:1px solid var(--border2);
  box-shadow:0 12px 40px rgba(0,0,0,.65);display:flex;align-items:center;gap:9px;max-width:380px;
  animation:toastIn .3s;}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast .ico{width:18px;height:18px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;}

/* 工作流画布 */
.workflow-layout{flex:1;display:flex;overflow:hidden;}
.wf-sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);
  background:linear-gradient(180deg,rgba(11,17,29,.85),rgba(8,12,21,.95));
  display:flex;flex-direction:column;}
.wf-sidebar-head{padding:12px 14px;border-bottom:1px solid var(--border);}
.wf-sidebar-title{font-size:11.5px;font-weight:700;margin-bottom:3px;}
.wf-sidebar-desc{font-size:9.5px;color:var(--txt3);line-height:1.5;}
.wf-sidebar-body{flex:1;overflow-y:auto;padding:10px;}
.wf-agent-item{display:flex;align-items:center;gap:9px;padding:9px;
  border-radius:8px;border:1px solid var(--border);background:rgba(17,26,43,.5);
  margin-bottom:6px;cursor:pointer;transition:.2s;}
.wf-agent-item:hover{background:rgba(37,99,235,.15);border-color:rgba(59,130,246,.5);
  transform:translateX(2px);}
.wf-agent-ic{width:26px;height:26px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;}
.wf-agent-info{flex:1;min-width:0;}
.wf-agent-name{font-size:11px;font-weight:650;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.wf-agent-meta{font-size:9px;color:var(--txt3);margin-top:2px;}

.wf-canvas-wrap{flex:1;position:relative;overflow:auto;background:#050810;
  background-image:radial-gradient(circle,rgba(52,72,105,.25) 1px,transparent 1px);
  background-size:24px 24px;}
.wf-canvas{position:relative;width:2200px;height:1200px;}
.wf-node{position:absolute;width:200px;padding:11px;border-radius:11px;
  background:linear-gradient(180deg,#172237,#111a2b);
  border:1.5px solid #22314a;cursor:grab;user-select:none;transition:.2s;
  box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:2;}
.wf-node:hover{border-color:#31456a;}
.wf-node.selected{border-color:#60a5fa;
  box-shadow:0 0 0 3px rgba(59,130,246,.3),0 8px 26px rgba(59,130,246,.35);z-index:10;}
.wf-node.dragging{cursor:grabbing;z-index:100;box-shadow:0 16px 44px rgba(0,0,0,.7);}
.wf-node-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.wf-node-ic{width:24px;height:24px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.wf-node-name{font-size:11.5px;font-weight:650;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wf-node-type{font-size:9px;color:var(--txt3);}
.wf-node-port{position:absolute;width:13px;height:13px;border-radius:50%;
  background:#16213a;border:2px solid #4a5f85;top:50%;margin-top:-6.5px;
  cursor:crosshair;transition:.15s;z-index:5;}
.wf-node-port:hover,.wf-node-port.hot{background:#3b82f6;border-color:#3b82f6;
  box-shadow:0 0 12px rgba(59,130,246,.9);transform:scale(1.3);}
.wf-port-in{left:-7px;}
.wf-port-out{right:-7px;}

.wf-toolbar{height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 14px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(11,17,29,.6),rgba(8,12,21,.4));}
.wf-toolbar-info{margin-left:auto;display:flex;gap:14px;font-size:10.5px;color:var(--txt3);}
.wf-toolbar-info b{color:var(--txt2);font-family:ui-monospace,monospace;}

/* 智能体表单内的区块 */
.form-section{padding:12px;border-radius:10px;background:rgba(10,15,25,.6);
  border:1px solid var(--border);margin-bottom:12px;}
.form-section-title{font-size:11px;font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;}
.form-section-title::before{content:'';width:4px;height:4px;border-radius:50%;
  background:#3b82f6;box-shadow:0 0 6px #3b82f6;}

/* 引导大卡 */
.guide-card{padding:20px;border-radius:14px;
  background:linear-gradient(135deg,rgba(37,99,235,.15),rgba(15,23,42,.9));
  border:1px solid rgba(59,130,246,.35);margin-bottom:16px;
  display:flex;align-items:center;gap:20px;}
.guide-card-icon{width:60px;height:60px;border-radius:15px;flex-shrink:0;
  background:linear-gradient(135deg,#1e3a8a,#2563eb);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 8px 30px rgba(37,99,235,.5);}
.guide-card-content{flex:1;}
.guide-card-title{font-size:16px;font-weight:800;margin-bottom:6px;}
.guide-card-desc{font-size:11.5px;color:var(--txt2);line-height:1.7;}
.guide-card-actions{display:flex;gap:8px;margin-top:10px;}

.help-banner{padding:12px 16px;border-radius:10px;
  background:rgba(37,99,235,.08);border:1px solid rgba(59,130,246,.25);
  font-size:11px;color:var(--txt2);line-height:1.7;margin-bottom:14px;
  display:flex;align-items:flex-start;gap:10px;}
.help-banner .icon{font-size:16px;flex-shrink:0;}

.empty{padding:50px 20px;text-align:center;color:var(--txt3);}
.empty .ic{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:rgba(37,99,235,.1);border:1px solid rgba(59,130,246,.2);}
.empty .tt{font-size:13px;font-weight:700;color:var(--txt2);margin-bottom:6px;}
.empty .dd{font-size:11px;line-height:1.7;}

/* 关系图 */
.relation-graph{padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.rel-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.rel-box{padding:10px 16px;border-radius:10px;font-size:11px;font-weight:650;
  background:rgba(17,26,43,.7);border:1px solid var(--border2);min-width:110px;
  text-align:center;position:relative;}
.rel-arrow{color:var(--txt3);font-size:16px;align-self:center;}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1f2c44;border-radius:8px;
  border:2px solid transparent;background-clip:content-box}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand" onclick="goHome()">
      <div class="brand-logo">🧠</div>
      <div>
        <div class="brand-name">NexusFlow · 智流平台</div>
        <div class="brand-sub">Agentic Process Automation</div>
      </div>
    </div>
    <nav class="top-menu" id="topMenu"></nav>
    <div class="top-stats">
      <div class="ts-item"><div class="ts-label">智能体</div><div class="ts-val c" id="stAgents">0</div></div>
      <div class="ts-item"><div class="ts-label">工作流</div><div class="ts-val v" id="stWorkflows">0</div></div>
      <div class="ts-item"><div class="ts-label">机器人</div><div class="ts-val a" id="stRobots">0</div></div>
      <div class="ts-item"><div class="ts-label">执行中</div><div class="ts-val g" id="stRunning">0</div></div>
    </div>
  </header>

  <!-- ===== 8步引导条 ===== -->
  <div class="guide-bar" id="guideBar"></div>

  <!-- ===== 主视图 ===== -->
  <div class="main">

    <!-- 视图：仪表盘 -->
    <div class="view active" id="view-dashboard">
      <div class="content" id="dashboardContent"></div>
    </div>

    <!-- 视图：配置中心 -->
    <div class="view" id="view-config">
      <div class="page-head">
        <div class="page-icon">⚙</div>
        <div>
          <div class="page-title">基础设施配置</div>
          <div class="page-desc">配置大模型、虚拟系统、角色、机器人、MCP 工具、知识库、提示词</div>
        </div>
      </div>
      <div style="flex:1;display:flex;overflow:hidden;">
        <div style="width:180px;flex-shrink:0;border-right:1px solid var(--border);
          background:rgba(8,12,21,.5);padding:10px;" id="configTabs"></div>
        <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
          <div class="page-head" style="height:46px;border-top:none;padding:0 16px;">
            <span style="font-size:11.5px;font-weight:700;" id="configTitle">-</span>
            <div class="right"><button class="btn btn-sm btn-primary" id="configCreateBtn">+ 新建</button></div>
          </div>
          <div class="content" id="configContent"></div>
        </div>
      </div>
    </div>

    <!-- 视图：智能体 -->
    <div class="view" id="view-agents">
      <div class="page-head">
        <div class="page-icon">🤖</div>

const CONFIG_TABS = [
  { id:'models',    name:'⚡ 大模型',      entity:'models',    title:'大模型管理',    desc:'智能体的"大脑"' },
  { id:'vms',       name:'🌐 虚拟系统',    entity:'vms',       title:'虚拟系统管理',  desc:'隔离沙箱环境' },
  { id:'roles',     name:'🎭 角色',        entity:'roles',     title:'角色管理',      desc:'岗位职责定义' },
  { id:'robots',    name:'🤖 机器人',      entity:'robots',    title:'机器人管理',    desc:'执行实例' },
  { id:'mcps',      name:'🔌 MCP 工具',    entity:'mcps',      title:'MCP 工具集',    desc:'智能体的"手脚"' },
  { id:'knowledge', name:'📚 知识库',      entity:'knowledge', title:'知识库管理',    desc:'智能体的"记忆"' },
  { id:'prompts',   name:'✎ 提示词',       entity:'prompts',   title:'提示词管理',    desc:'岗位说明书' },
];

function renderConfig(){
  const tabs = CONFIG_TABS.map(t =>
    `<div class="menu-item ${state.curConfigTab===t.id?'active':''}"
      style="padding:8px 12px;margin-bottom:3px;width:100%;justify-content:flex-start;"
      onclick="switchConfigTab('${t.id}')">
      <span>${t.name}</span>
    </div>`).join('');
  $('configTabs').innerHTML = tabs;

  const tab = CONFIG_TABS.find(t=>t.id===state.curConfigTab);
  $('configTitle').textContent = tab.title + ' · ' + tab.desc;

  // 绑定新建按钮
  const createBtn = $('configCreateBtn');
  createBtn.onclick = () => openConfigForm(tab.id);

  const items = DB[tab.entity] || [];
  if (!items.length){
    $('configContent').innerHTML = `<div class="empty">
      <div class="ic">${tab.name.split(' ')[0]}</div>
      <div class="tt">暂无 ${tab.title}</div>
      <div class="dd">点击右上角"+ 新建"创建第一个</div>
    </div>`;
    return;
  }

  $('configContent').innerHTML = `<div class="grid">${
    items.map(item => renderConfigItem(tab.id, item)).join('')
  }</div>`;
}

function switchConfigTab(id){
  state.curConfigTab = id;
  renderConfig();
}

function renderConfigItem(tab, item){
  const deleteBtn = `<button class="btn btn-sm btn-danger" style="flex:1;justify-content:center;padding:4px 8px;font-size:10px;"
    onclick="event.stopPropagation();deleteConfigItem('${tab}','${item.id}')">删除</button>`;

  let extra = '';
  let actions = `<div class="card-actions">${deleteBtn}</div>`;

  if (tab === 'models'){
    extra = `<div class="card-foot">
      <span>${item.provider}</span>
      <span class="status-pill ${item.enabled?'ready':'draft'}">${item.enabled?'已启用':'未启用'}</span>
    </div>`;
  } else if (tab === 'vms'){
    extra = `<div class="card-foot"><span>${item.ip}</span><span>${item.spec}</span></div>`;
  } else if (tab === 'roles'){
    const vm = DB.vms.find(v=>v.id===item.vmId);
    extra = `<div class="card-foot"><span>${item.ability}</span><span>VM: ${vm?.name||'-'}</span></div>`;
  } else if (tab === 'robots'){
    const role = DB.roles.find(r=>r.id===item.roleId);
    extra = `<div class="card-foot"><span>${role?.name||'-'}</span>
      <span class="status-pill ${item.status}">${item.status==='idle'?'空闲':'忙碌'}</span></div>`;
  } else if (tab === 'mcps'){
    extra = `<div class="card-foot"><span>${item.type}</span><span>${item.desc}</span></div>`;
  } else if (tab === 'knowledge'){
    extra = `<div class="card-foot"><span>来源 ${item.source}</span><span>${item.desc}</span></div>`;
  } else if (tab === 'prompts'){
    extra = `<div class="card-desc" style="margin-top:6px;padding:8px;background:rgba(5,8,15,.5);border-radius:6px;font-family:ui-monospace,monospace;font-size:10px;">${escapeHTML(item.content||'')}</div>`;
    actions = `<div class="card-actions">
      <button class="btn btn-sm" style="flex:1;justify-content:center;padding:4px 8px;font-size:10px;"
        onclick="event.stopPropagation();editPrompt('${item.id}')">编辑</button>
      ${deleteBtn}</div>`;
  }

  return `
    <div class="card">
      <div class="card-head">
        <div class="card-ic" style="background:${item.color||'#3b82f6'}22;color:${item.color||'#3b82f6'}">
          ${item.icon||'◈'}
        </div>
        <div class="card-name">${item.name}</div>
      </div>
      <div class="card-desc">${item.desc||''}</div>
      ${extra}
      ${actions}
    </div>
  `;
}

function deleteConfigItem(tab, id){
  if (!confirm('确定删除？')) return;
  const arr = DB[tab];
  const idx = arr.findIndex(x=>x.id===id);
  if (idx >= 0) { arr.splice(idx, 1); }
  toast('已删除', 'ok');
  renderConfig();
  renderGuide();
}

      <div class="form-section-title">基本信息</div>
      <div class="field-row">
        <div class="field"><label>智能体名称</label>
          <input id="a-name" placeholder="如：债券开户智能助手"/></div>
        <div class="field"><label>业务分类</label>
          <input id="a-category" placeholder="如：证券 / 财务" value="通用"/></div>
      </div>
      <div class="field"><label>功能描述</label>
        <textarea id="a-desc" placeholder="简要说明该智能体能做什么"></textarea></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">🎭 绑定角色（必填）</div>
      <div class="field">
        <select id="a-role">
          ${DB.roles.map(r=>`<option value="${r.id}">${r.name} · ${r.ability}</option>`).join('')}
        </select>
        <div class="field-hint">角色定义了智能体的岗位职责与绑定的虚拟系统</div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">⚡ 大模型（必填）</div>
      <div class="field">
        <select id="a-model">
          ${DB.models.filter(m=>m.enabled).map(m=>`<option value="${m.id}">${m.name} · ${m.provider}</option>`).join('')}
        </select>
        <div class="field-hint">大模型是智能体的"大脑"，负责理解与决策</div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">🔌 MCP 工具（可选，多选）</div>
      <div class="tag-picker" id="a-mcps">
        ${DB.mcps.map(m=>`
          <div class="tag-option" data-id="${m.id}" onclick="toggleTag(this)">${m.icon} ${m.name}</div>
        `).join('')}
      </div>
      <div class="field-hint">MCP 工具是智能体的"手脚"，比如浏览器自动化、Excel 处理</div>
    </div>

    <div class="form-section">
      <div class="form-section-title">📚 知识库（可选，多选）</div>
      <div class="tag-picker" id="a-kbs">
        ${DB.knowledge.map(k=>`
          <div class="tag-option" data-id="${k.id}" onclick="toggleTag(this)">${k.icon} ${k.name}</div>
        `).join('')}
      </div>
      <div class="field-hint">知识库让智能体具备"记忆"，能查询业务规则</div>
    </div>

    <div class="form-section">
      <div class="form-section-title">✎ 提示词（可选）</div>
      <div class="field">
        <select id="a-prompt">
          <option value="">不绑定</option>
          ${DB.prompts.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
        </select>
        <div class="field-hint">提示词是智能体的"岗位说明书"</div>
      </div>
    </div>
  `, `
    <button class="btn btn-sm" onclick="closeModal()">取消</button>
    <button class="btn btn-sm btn-primary" onclick="submitAgentForm()">创建智能体</button>
  `);
}

function toggleTag(el){
  el.classList.toggle('on');
}

function submitAgentForm(){
  const name = $('a-name').value.trim();
  if (!name){ toast('请填写智能体名称','warn'); return; }
  const roleId = $('a-role').value;
  const modelId = $('a-model').value;
  const promptId = $('a-prompt').value || null;
  const mcpIds = Array.from($('a-mcps').querySelectorAll('.tag-option.on')).map(e=>e.dataset.id);
  const knowledgeIds = Array.from($('a-kbs').querySelectorAll('.tag-option.on')).map(e=>e.dataset.id);

  const role = DB.roles.find(r=>r.id===roleId);
  const colors = ['#3b82f6','#10e08a','#8b5cf6','#ec4899','#fbbf24','#22d3ee'];
  const icons = ['📈','📊','◉','✎','💰','🧠'];

  DB.agents.push({
    id: uid(),
    name,
    icon: icons[DB.agents.length % icons.length],
    color: colors[DB.agents.length % colors.length],
    desc: $('a-desc').value || '暂无描述',
    roleId, modelId, vmId: role?.vmId,
    mcpIds, knowledgeIds, promptId,
    category: $('a-category').value || '通用',
    runs: 0, successRate: 100, status: 'ready',
    createdAt: new Date().toISOString().slice(0,16).replace('T',' '),
  });

  closeModal();
  toast('智能体创建成功', 'ok');
  renderAgents();
  renderGuide();
  updateStats();
}

/* ============================================================
   工作流编排
============================================================ */
function renderWorkflows(){
  const ws = DB.workflows;
  // 下拉框
  $('wfSelector').innerHTML = ws.map(w=>
    `<option value="${w.id}" ${state.curWorkflowId===w.id?'selected':''}>${w.name}</option>`
  ).join('') || '<option>暂无工作流</option>';

  // 智能体调色板
  const palette = DB.agents;
  $('wfAgentPalette').innerHTML = palette.length ? palette.map(a=>`
    <div class="wf-agent-item" onclick="addAgentToCanvas('${a.id}')">
      <div class="wf-agent-ic" style="background:${a.color}22;color:${a.color}">${a.icon}</div>
      <div class="wf-agent-info">
        <div class="wf-agent-name">${a.name}</div>
        <div class="wf-agent-meta">${a.category} · ${a.runs} 次调用</div>
      </div>
    </div>
  `).join('') : `<div class="empty" style="padding:30px 10px;">
    <div class="dd">还没有智能体<br/>请先创建智能体</div>
  </div>`;

  renderWorkflowCanvas();
}

function selectWorkflow(id){
  state.curWorkflowId = id;
  state.selectedWfNodeId = null;
  renderWorkflowCanvas();
}

function renderWorkflowCanvas(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  const layer = $('wfNodeLayer');
  const svg = $('wfSvg');
  if (!wf){ layer.innerHTML=''; svg.innerHTML=''; 
    $('wfNodeCount').textContent = 0; $('wfEdgeCount').textContent = 0; return; }

  // 渲染节点
  layer.innerHTML = wf.nodes.map(n=>{
    const a = DB.agents.find(x=>x.id===n.agentId);
    if (!a) return '';
    return `
      <div class="wf-node ${state.selectedWfNodeId===n.id?'selected':''}" 
           data-node-id="${n.id}" style="left:${n.x}px;top:${n.y}px;">
        <div class="wf-node-head">
          <div class="wf-node-ic" style="background:${a.color}22;color:${a.color}">${a.icon}</div>
          <div class="wf-node-name">${a.name}</div>
        </div>
        <div class="wf-node-type">${a.category} · 智能体</div>
        <div class="wf-node-port wf-port-in"></div>
        <div class="wf-node-port wf-port-out"></div>
      </div>
    `;
  }).join('');

  // 渲染连线
  const NODE_W = 200;
  svg.innerHTML = `
    <defs>
      <marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
      </marker>
    </defs>
    ${wf.edges.map(e=>{
      const n1 = wf.nodes.find(n=>n.id===e.from);
      const n2 = wf.nodes.find(n=>n.id===e.to);
      if (!n1 || !n2) return '';
      const x1 = n1.x + NODE_W, y1 = n1.y + 40;
      const x2 = n2.x, y2 = n2.y + 40;
      const cx = (x1+x2)/2;
      const d = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
      return `<path d="${d}" fill="none" stroke="#3b82f6" stroke-width="2"
        marker-end="url(#wfArrow)"
        style="filter:drop-shadow(0 0 4px rgba(59,130,246,.7))"/>`;
    }).join('')}
  `;

  // 绑定交互
  bindWfInteractions();
  $('wfNodeCount').textContent = wf.nodes.length;
  $('wfEdgeCount').textContent = wf.edges.length;
}

function addAgentToCanvas(agentId){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf){ toast('请先创建工作流','warn'); return; }
  const a = DB.agents.find(x=>x.id===agentId);
  if (!a) return;
  // 找一个空位置
  const baseX = 80 + (wf.nodes.length * 240) % 1200;
  const baseY = 100 + Math.floor(wf.nodes.length / 5) * 180;
  wf.nodes.push({
    id: uid(),
    agentId,
    x: baseX,
    y: baseY,
  });
  renderWorkflowCanvas();
  toast(`已添加「${a.name}」到工作流`, 'ok');
}

function bindWfInteractions(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf) return;

  // 节点拖拽 + 选中
  document.querySelectorAll('.wf-node').forEach(el=>{
    el.addEventListener('mousedown', e=>{
      if (e.target.classList.contains('wf-node-port')) return;
      const nodeId = el.dataset.nodeId;
      const node = wf.nodes.find(n=>n.id===nodeId);
      if (!node) return;

      const startX = e.clientX;
      const startY = e.clientY;
      const startNX = node.x;
      const startNY = node.y;
      let moved = false;

      function onMove(ev){
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        node.x = Math.max(0, startNX + dx);
        node.y = Math.max(0, startNY + dy);
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
        redrawWfEdges();
      }
      function onUp(){
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        if (!moved){
          state.selectedWfNodeId = nodeId;
          renderWorkflowCanvas();
        }
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  });

  // 端口连线
  document.querySelectorAll('.wf-port-out').forEach(el=>{
    el.addEventListener('mousedown', e=>{
      e.stopPropagation();
      state.wfConnecting = el.closest('.wf-node').dataset.nodeId;
      toast('请点击目标节点的左侧端口完成连线', 'info');
    });
  });
  document.querySelectorAll('.wf-port-in').forEach(el=>{
    el.addEventListener('mousedown', e=>{
      e.stopPropagation();
      if (!state.wfConnecting) return;
      const toId = el.closest('.wf-node').dataset.nodeId;
      const fromId = state.wfConnecting;
      if (fromId === toId){ state.wfConnecting = null; return; }
      if (wf.edges.some(edge=>edge.from===fromId && edge.to===toId)){
        toast('连线已存在', 'warn');
      } else {
        wf.edges.push({ from: fromId, to: toId });
        toast('已建立连线', 'ok');
      }
      state.wfConnecting = null;
      renderWorkflowCanvas();
    });
  });
}

function redrawWfEdges(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf) return;
  const svg = $('wfSvg');
  const NODE_W = 200;
  svg.innerHTML = `
    <defs>
      <marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
      </marker>
    </defs>
    ${wf.edges.map(e=>{
      const n1 = wf.nodes.find(n=>n.id===e.from);
      const n2 = wf.nodes.find(n=>n.id===e.to);
      if (!n1 || !n2) return '';
      const x1 = n1.x + NODE_W, y1 = n1.y + 40;
      const x2 = n2.x, y2 = n2.y + 40;
      const cx = (x1+x2)/2;
      const d = `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`;
      return `<path d="${d}" fill="none" stroke="#3b82f6" stroke-width="2"
        marker-end="url(#wfArrow)"
        style="filter:drop-shadow(0 0 4px rgba(59,130,246,.7))"/>`;
    }).join('')}
  `;
}

function deleteSelectedNode(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf || !state.selectedWfNodeId){ toast('请先选择节点','warn'); return; }
  if (!confirm('删除选中节点？')) return;
  wf.nodes = wf.nodes.filter(n=>n.id!==state.selectedWfNodeId);
  wf.edges = wf.edges.filter(e=>e.from!==state.selectedWfNodeId && e.to!==state.selectedWfNodeId);
  state.selectedWfNodeId = null;
  renderWorkflowCanvas();
  toast('已删除节点','ok');
}

function clearWorkflowCanvas(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf){ return; }
  if (!confirm('清空所有节点和连线？')) return;
  wf.nodes = [];
  wf.edges = [];
  state.selectedWfNodeId = null;
  renderWorkflowCanvas();
  toast('已清空画布','ok');
}

function autoLayoutWorkflow(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf || !wf.nodes.length){ return; }
  // 简单排列：水平排列
  const NODE_W = 200, GAP = 60;
  wf.nodes.forEach((n, i)=>{
    n.x = 80 + i * (NODE_W + GAP);
    n.y = 200;
  });
  renderWorkflowCanvas();
  toast('已自动布局','ok');
}

function openWorkflowForm(){
  openModal('新建工作流', `
    <div class="field"><label>工作流名称</label>
      <input id="wf-name" placeholder="如：债券开户全流程"/></div>
    <div class="field"><label>描述</label>
      <textarea id="wf-desc" placeholder="简要说明该工作流的用途"></textarea></div>
    <div class="field-hint">💡 工作流用于串联多个智能体，形成完整业务流程。</div>
  `, `
    <button class="btn btn-sm" onclick="closeModal()">取消</button>
    <button class="btn btn-sm btn-primary" onclick="submitWorkflowForm()">创建</button>
  `);
}

function submitWorkflowForm(){
  const name = $('wf-name').value.trim();
  if (!name){ toast('请填写工作流名称','warn'); return; }
  const wf = {
    id: uid(),
    name,
    desc: $('wf-desc').value || '',
    createdAt: new Date().toISOString().slice(0,16).replace('T',' '),
    nodes: [],
    edges: [],
  };
  DB.workflows.push(wf);
  state.curWorkflowId = wf.id;
  state.selectedWfNodeId = null;
  closeModal();
  toast('工作流创建成功', 'ok');
  renderWorkflows();
  renderGuide();
  updateStats();
}

/* ============================================================
   启动执行
============================================================ */
async function runWorkflow(){
  const wf = DB.workflows.find(w=>w.id===state.curWorkflowId);
  if (!wf){ toast('请先选择工作流','warn'); return; }
  if (!wf.nodes.length){ toast('工作流为空，请先添加节点','warn'); return; }
  if (!DB.robots.length){ toast('请先创建机器人','warn'); return; }

  // 选择空闲机器人
  const robot = DB.robots.find(r=>r.status==='idle') || DB.robots[0];
  robot.status = 'busy';

  // 排序节点（简化：按 x 坐标）
  const sortedNodes = [...wf.nodes].sort((a,b)=>a.x - b.x);

  const execution = {
    id: uid(),
    wfId: wf.id,
    wfName: wf.name,
    robotId: robot.id,
    robotName: robot.name,
    status: 'running',
    startAt: new Date().toISOString().slice(0,19).replace('T',' '),
    duration: '—',
    nodesDone: 0,
    nodesTotal: sortedNodes.length,
    steps: sortedNodes.map(n=>({ agentId: n.agentId, status: 'pending', duration: '—' })),
  };
  DB.executions.unshift(execution);

  toast(`工作流已启动 · 由 ${robot.name} 执行`, 'ok');
  switchView('executions');

  // 模拟执行
  const t0 = Date.now();
  for (let i = 0; i < sortedNodes.length; i++){
    execution.steps[i].status = 'running';
    renderExecutions();
    await sleep(900 + Math.random()*600);
    execution.steps[i].status = 'done';
    execution.steps[i].duration = (0.8 + Math.random()*1.5).toFixed(1) + 's';
    execution.nodesDone = i + 1;
    renderExecutions();
  }

  execution.status = 'done';
  execution.duration = ((Date.now()-t0)/1000).toFixed(1) + 's';
  robot.status = 'idle';
  robot.tasks += 1;
  renderExecutions();
  renderGuide();
  updateStats();
  toast(`工作流执行完成 · 耗时 ${execution.duration}`, 'ok');
}

/* ============================================================
   执行记录
============================================================ */
function renderExecutions(){
  const list = DB.executions;
  if (!list.length){
    $('executionsContent').innerHTML = `<div class="empty">
      <div class="ic">📋</div>
      <div class="tt">暂无执行记录</div>
      <div class="dd">前往「工作流编排」页面选择工作流并点击「启动执行」</div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="switchView('workflows')">前往工作流编排</button>
    </div>`;
    return;
  }

  $('executionsContent').innerHTML = `
    <div class="help-banner">
      <span class="icon">💡</span>
      <div>每次执行都记录了完整的智能体调用轨迹，可用于审计与优化。</div>
    </div>
    ${list.map(e=>renderExecutionCard(e)).join('')}
  `;
}

function renderExecutionCard(e){
  const statusMap = {
    done: { label:'已完成', cls:'done', color:'#10e08a' },
    running: { label:'执行中', cls:'running', color:'#fbbf24' },
    error: { label:'失败', cls:'error', color:'#f43f5e' },
  };
  const st = statusMap[e.status] || statusMap.done;
  const pct = Math.round(e.nodesDone / e.nodesTotal * 100);

  return `
    <div class="card" style="margin-bottom:12px;cursor:default;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <div class="card-ic" style="background:${st.color}22;color:${st.color}">▶</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">${e.wfName}</div>
          <div style="font-size:10px;color:var(--txt3);margin-top:2px;">
            ${e.startAt} · 机器人 ${e.robotName} · 耗时 ${e.duration}
          </div>
        </div>
        <span class="status-pill ${st.cls}">${st.label}</span>
      </div>
      
      <!-- 进度条 -->
      <div style="height:6px;border-radius:4px;background:rgba(143,163,192,.13);overflow:hidden;margin-bottom:10px;">
        <div style="height:100%;width:${pct}%;border-radius:4px;
          background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .5s;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-bottom:10px;">
        <span>已完成 <b style="color:#4ef0ac;">${e.nodesDone}</b> / ${e.nodesTotal} 个节点</span>
        <span>${pct}%</span>
      </div>

      <!-- 执行轨迹 -->
      <div style="padding:12px;background:rgba(5,8,15,.5);border-radius:8px;">
        <div style="font-size:10.5px;color:var(--txt3);margin-bottom:8px;">执行轨迹</div>
        ${e.steps.map((s, i) => {
          const a = DB.agents.find(x=>x.id===s.agentId);
          const stepStatusColor = { done:'#10e08a', running:'#fbbf24', pending:'#556a89' }[s.status];
          const stepIcon = { done:'✓', running:'▶', pending:'○' }[s.status];
          return `
            <div style="display:flex;align-items:center;gap:10px;padding:6px 0;
              ${i < e.steps.length-1 ? 'border-bottom:1px dashed var(--border);' : ''}">
              <div style="width:20px;height:20px;border-radius:50%;flex-shrink:0;
                display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
                background:${stepStatusColor}22;color:${stepStatusColor};">
                ${stepIcon}
              </div>
              <div style="flex:1;display:flex;align-items:center;gap:8px;">
                <span style="font-size:11px;font-weight:650;">${a?.name||'未知智能体'}</span>
                <span style="font-size:9px;color:var(--txt3);">${a?.category||''}</span>
              </div>
              <span style="font-size:10px;color:var(--txt3);font-family:ui-monospace,monospace;">
                ${s.duration}
              </span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ============================================================
   顶部统计
============================================================ */
function updateStats(){
  $('stAgents').textContent = DB.agents.length;
  $('stWorkflows').textContent = DB.workflows.length;
  $('stRobots').textContent = DB.robots.length;
  $('stRunning').textContent = DB.executions.filter(e=>e.status==='running').length;
}

/* ============================================================
   模态框
============================================================ */
function openModal(title, body, foot=''){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = body;
  $('modalFoot').innerHTML = foot || `<button class="btn btn-sm" onclick="closeModal()">关闭</button>`;
  $('modalMask').classList.add('show');
}
function closeModal(){ $('modalMask').classList.remove('show'); }

/* ============================================================
   启动
============================================================ */
window.addEventListener('load', () => {
  renderMenus();
  renderGuide();
  renderDashboard();
  updateStats();
  setTimeout(()=>toast('NexusFlow 已就绪', 'ok'), 600);
});

// 定期刷新引导（当数据变化时）
setInterval(()=>{
  renderGuide();
  updateStats();
}, 2000);
</script>
